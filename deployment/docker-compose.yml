services:
  attache:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: attache:local
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8080/healthz')\""]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
